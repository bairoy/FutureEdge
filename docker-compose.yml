

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: futureedge_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - qdrant

  postgres:
    image: postgres:16
    container_name: futureedge_postgres
    restart: always
    environment:
      POSTGRES_USER: futureedge
      POSTGRES_PASSWORD: futureedge
      POSTGRES_DB: futureedge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: futureedge_redis
    restart: always
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: futureedge_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: