
services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: futureedge_backend
    # Override Dockerfile CMD to add --timeout-graceful-shutdown 3.
    # This prevents Uvicorn from hanging indefinitely at "Waiting for background
    # tasks to complete" during hot-reload, which caused 500 errors on login.
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --reload
      --timeout-graceful-shutdown 3
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - .env:/app/.env
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: futureedge_frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: futureedge_postgres
    restart: always
    # Read from .env — the same file the backend loads via env_file, so the
    # database and the app can never drift onto different credentials.
    #
    # NOTE: Postgres only applies these on FIRST init of an empty data
    # directory. Changing POSTGRES_PASSWORD for an existing postgres_data
    # volume does nothing to the stored password — you must either ALTER USER
    # inside the running container, or drop the volume and re-init.
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-futureedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-futureedge}
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futureedge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: futureedge_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: futureedge_qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: